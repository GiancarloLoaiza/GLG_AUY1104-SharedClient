# ─────────────────────────────────────────────────────────────
# Pipeline de validación desacoplado
# Se ejecuta con push en ramas de desarrollo
# NO corre en main ni en tags
# Solo ejecuta pruebas, no construye ni publica imágenes
# ─────────────────────────────────────────────────────────────

name: Pipeline de Tests

on:
  workflow_dispatch: 
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '**'

jobs:
  run-tests:
    name: Instalar dependencias y ejecutar tests
    runs-on: ubuntu-latest
    steps:
      - name: 1 · Descargar el código
        uses: actions/checkout@v4

      - name: 2 · Instalar dependencias
        run: npm install

      - name: 3 · Ejecutar tests
        run: npm test
jobs:
  run-tests:
    name: Instalar dependencias y ejecutar tests
    runs-on: ubuntu-latest
    steps:
      - name: 4 · Autenticar en AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1  # <-- CAMBIA ESTO por la región de tu instancia de AWS (ej. us-east-1, us-west-2, etc.)

      - name: 5 · Validar estado del Rollout en EC2 vía SSM
        uses: peterkimzz/aws-ssm-command-action@v1.1.0
        with:
          # Reemplaza 'i-xxxxxxxxxxxxxxxxx' por el ID real de tu instancia EC2 de AWS
          instance-ids: 'i-xxxxxxxxxxxxxxxxx' 
          comment: 'Validando el rollout de la API desde GitHub Actions'
          working-directory: '/home/ubuntu'
          command: |
            sudo k3s kubectl rollout status deployment/demo-api --timeout=3m
