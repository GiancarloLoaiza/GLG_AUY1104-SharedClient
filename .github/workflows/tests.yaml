# ─────────────────────────────────────────────────────────────
# Pipeline de validación desacoplado
# Se ejecuta con push en ramas de desarrollo
# NO corre en main ni en tags
# Solo ejecuta pruebas, no construye ni publica imágenes
# ─────────────────────────────────────────────────────────────

name: Pipeline de Tests

on:
  workflow_dispatch: 
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '**'

jobs:
  run-tests:
    name: Instalar dependencias y ejecutar tests
    runs-on: ubuntu-latest
    steps:
      - name: 1 · Descargar el código
        uses: actions/checkout@v4

      - name: 2 · Instalar dependencias
        run: npm install

      - name: 3 · Ejecutar tests
        run: npm test

      - name: 4 · Validar estado del Rollout en AWS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ inputs.K3S_SER_PUBLIC_IP }}  # <-- IMPORTANTE: Pon aquí la IP pública de tu instancia AWS
          username: ubuntu
          key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}
          script: |
            sudo k3s kubectl rollout status deployment/demo-api --timeout=3m
